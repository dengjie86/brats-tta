name: CPU checks

on:
  pull_request:
    paths: ['src/**', 'tests/**', 'configs/**', 'scripts/project.ps1', 'pyproject.toml', '.github/**']
  push:
    paths: ['src/**', 'tests/**', 'configs/**', 'scripts/project.ps1', 'pyproject.toml', '.github/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            .github/requirements-cpu.txt
            .github/workflows/ci.yml
            pyproject.toml
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .github/requirements-cpu.txt
          python -m pip install --no-deps -e .
      - name: Check source and tests
        shell: pwsh
        run: ./scripts/project.ps1 lint -Python (Get-Command python).Source
      - name: Run focused CPU suite
        shell: pwsh
        run: ./scripts/project.ps1 test -Python (Get-Command python).Source
      - name: Check catalog without local data
        run: brats-experiments --root . check
