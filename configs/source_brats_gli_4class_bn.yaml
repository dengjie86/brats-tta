experiment:
  name: source_brats_gli_plain_unet3d_6stage_4class_bn
  output_dir: outputs/source_brats_gli_plain_unet3d_6stage_4class_bn
  seed: 2025
  deterministic: false

data:
  # Kaggle training overrides these with manifests generated from the public GLI archive.
  train_manifest: data/manifests/gli_train_raw.json
  val_manifest: data/manifests/gli_val_raw.json
  label_schema: brats_modern
  patch_size: [128, 128, 128]
  num_workers: 12
  validation_num_workers: 2
  prefetch_factor: 4
  validation_prefetch_factor: 1
  persistent_workers: true
  pin_memory: true
  augmentation:
    foreground_oversample: 0.33
    # BraTS array axis 0 is the left-right axis after the challenge preprocessing.
    flip_axes: [0]
    flip_probability: 0.5
    affine_probability: 0.5
    affine_scale_range: [0.8, 1.2]
    affine_degrees: 15.0
    gamma_probability: 0.5
    gamma_log_range: [-0.3, 0.3]
    # Linear scale/shift are disabled in the fixed source training protocol.
    intensity_scale_probability: 0.0
    intensity_scale_range: [0.9, 1.1]
    intensity_shift_probability: 0.0
    intensity_shift_range: [-0.1, 0.1]
    noise_probability: 0.5
    noise_std_range: [0.0, 0.05]

model:
  name: plain_unet3d
  in_channels: 4
  out_channels: 4
  output_mode: classes_softmax
  # nnU-Net-style 3D schedule: base width 32, channel cap 320, six stages.
  features: [32, 64, 128, 256, 320, 320]
  convs_per_stage: 2
  deep_supervision: true
  norm: batch3d
  norm_eps: 1.0e-5
  norm_affine: true
  track_running_stats: true
  norm_momentum: 0.1
  sync_batchnorm: true
  activation: leaky_relu
  negative_slope: 0.01
  dropout: 0.0

loss:
  dice_weight: 1.0
  ce_weight: 1.0
  include_background: true
  smooth: 1.0e-5
  batch_dice: false
  # Outputs are 128^3, 64^3, 32^3, 16^3 and 8^3. The lowest output is not supervised.
  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125, 0.0]

training:
  device: auto
  batch_size: 2
  epochs: 300
  iterations_per_epoch: 250
  validate_every: 10
  save_every: 20
  validation_cases: null
  # Keep every training iteration in training.log for reproducibility.
  log_every: 1
  validation_log_every: 1
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.99
  nesterov: true
  weight_decay: 3.0e-5
  poly_exponent: 0.9
  gradient_clip_norm: 12.0
  amp: false

inference:
  patch_size: [128, 128, 128]
  overlap: 0.5
  sw_batch_size: 1
  gaussian_weighting: true
  amp: false
  threshold: 0.5
  enforce_hierarchy: false
